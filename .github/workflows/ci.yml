name: CI

on:
  push:
  pull_request:

jobs:
  manager-linux:
    name: Manager Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            protobuf-compiler \
            libprotobuf-dev \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            libsqlite3-dev

      - name: Build Manager
        run: ./scripts/build_manager.sh "$GITHUB_WORKSPACE/build/manager-linux"

      - name: Verify Manager Binary
        run: test -x "$GITHUB_WORKSPACE/build/manager-linux/manager"

  agent-linux:
    name: Agent Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            protobuf-compiler \
            libprotobuf-dev \
            libgrpc++-dev \
            protobuf-compiler-grpc \
            libsqlite3-dev

      - name: Build Agent
        run: ./scripts/build_agent.sh "$GITHUB_WORKSPACE/build/agent-linux"

      - name: Verify Agent Binary
        run: test -x "$GITHUB_WORKSPACE/build/agent-linux/agent"

  manager-windows:
    name: Manager Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Windows Dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install grpc:x64-windows protobuf:x64-windows sqlite3:x64-windows

      - name: Build Manager
        shell: pwsh
        run: |
          ./scripts/build_manager.ps1 `
            -BuildDir "build/manager-win" `
            -Config "Release" `
            -Generator "Visual Studio 17 2022" `
            -Architecture "x64" `
            -VcpkgToolchain "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Verify Manager Binary
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\build\manager-win\Release\manager.exe")) {
            throw "manager.exe not found"
          }
